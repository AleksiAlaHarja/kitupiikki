name: Build Kitsas Windows
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          # Kokeillaan ilman moduulilistausta, aqt hakee ne usein automaattisesti
          install-deps: 'true'

      - name: Build
        shell: cmd
        run: |
          qmake kitsasproject.pro "CONFIG += release"
          mingw32-make -j 2

      - name: Deploy Dependencies
        shell: cmd
        run: |
          windeployqt --release --no-translations kitsas/release/kitsas.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitsas-Windows-Portable
          path: kitsas/release/
